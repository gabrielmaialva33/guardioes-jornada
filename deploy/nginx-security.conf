# Shared response headers for the Guardiões site. Included in every location,
# because an add_header inside a location drops the server-level ones.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=()" always;
add_header X-Frame-Options "DENY" always;

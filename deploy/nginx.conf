# Guardiões da Mata Atlântica: static PWA served on localhost only and
# published to the internet by cloudflared (tunnel ingress -> 127.0.0.1:8095).
server {
	listen 127.0.0.1:8095;
	server_name xn--guardioesmataatlntica-c1b.site;

	root /var/www/guardioes-jornada/current;
	index index.html;

	# Behind the tunnel the public host and port differ; keep redirects relative.
	absolute_redirect off;

	gzip on;
	gzip_static on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml model/gltf-binary application/octet-stream;

	# The launcher checks the current manifest only after explicit download consent.
	location = /game-packs/latest.json {
		include snippets/guardioes-security.conf;
		add_header Cache-Control "no-cache" always;
		try_files $uri =404;
	}

	# Independent content-addressed packs include their own runtime and encodings.
	location /game-packs/ {
		include snippets/guardioes-security.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# Content-hashed build output: cache forever.
	location /_app/immutable/ {
		include snippets/guardioes-security.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# The worker must be revalidated on every visit so updates reach the phones.
	location = /service-worker.js {
		include snippets/guardioes-security.conf;
		add_header Cache-Control "no-cache" always;
		try_files $uri =404;
	}

	location = /manifest.webmanifest {
		include snippets/guardioes-security.conf;
		add_header Cache-Control "no-cache" always;
		default_type application/manifest+json;
		try_files $uri =404;
	}

	# Prerendered pages: /journey/ -> /journey/index.html
	location / {
		include snippets/guardioes-security.conf;
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri/ =404;
	}
}

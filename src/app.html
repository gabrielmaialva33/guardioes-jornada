<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Aceite o chamado da floresta e cumpra as missões dos Guardiões da Mata Atlântica. Funciona sem internet."
		/>
		<meta name="theme-color" content="#0b1a12" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-180.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<title>Guardiões da Mata Atlântica</title>
		<script>
			// Apply the theme before first paint so it does not flash between sun and shade.
			try {
				const p = JSON.parse(localStorage.getItem('guardioes-preferences') || '{}');
				if (p.theme === 'sol') document.documentElement.dataset.theme = 'sol';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

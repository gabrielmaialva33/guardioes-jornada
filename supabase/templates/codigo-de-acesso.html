<!doctype html>
<html lang="pt-BR">
	<body style="margin: 0; padding: 0; background: #0a1a10">
		<table
			role="presentation"
			width="100%"
			cellpadding="0"
			cellspacing="0"
			style="background: #0a1a10; padding: 32px 12px"
		>
			<tr>
				<td align="center">
					<table
						role="presentation"
						width="100%"
						cellpadding="0"
						cellspacing="0"
						style="max-width: 440px; background: #13281c; border: 1px solid #2c4a3a; border-radius: 18px"
					>
						<tr>
							<td
								style="padding: 28px 28px 8px; font-family: Georgia, serif; color: #a9dcbf; font-size: 16px"
							>
								Guardiões da Mata Atlântica
							</td>
						</tr>
						<tr>
							<td
								style="
									padding: 0 28px;
									font-family: Arial, Helvetica, sans-serif;
									color: #e6f6ea;
									font-size: 18px;
									line-height: 1.5;
								"
							>
								Digite este código no aplicativo para entrar:
							</td>
						</tr>
						<tr>
							<td align="center" style="padding: 20px 28px">
								<div
									style="
										display: inline-block;
										padding: 14px 22px;
										border-radius: 14px;
										background: #6bcf9d;
										color: #0a1a10;
										font-family: Arial, Helvetica, sans-serif;
										font-size: 34px;
										font-weight: 800;
										letter-spacing: 8px;
									"
								>
									{{ .Token }}
								</div>
							</td>
						</tr>
						<tr>
							<td
								style="
									padding: 0 28px 28px;
									font-family: Arial, Helvetica, sans-serif;
									color: #9dc6af;
									font-size: 14px;
									line-height: 1.5;
								"
							>
								O código vale por 1 hora. Se você não pediu para entrar, pode ignorar este e-mail.
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
